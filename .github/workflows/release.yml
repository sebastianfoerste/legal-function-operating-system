name: release

# Publishes legal-function-os to PyPI with trusted publishing, so no API token is
# stored anywhere. It does nothing until the maintainer has:
#   1. added this repository as a trusted publisher for the PyPI project
#      legal-function-os (workflow: release.yml, environment: pypi), and
#   2. set the repository variable PYPI_PUBLISH to "true".
# After that, publishing a GitHub release whose tag is v<version> builds the sdist
# and wheel, checks that the wheel installs and runs, and uploads both.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="$(PYTHONPATH=src python -c 'import legal_function_os; print(legal_function_os.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
      - name: Check the wheel installs and runs
        run: make package-check PYTHON=python
      - name: Build the sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/legal-function-os/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
