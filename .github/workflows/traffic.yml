name: traffic-snapshot

# GitHub's traffic API keeps a rolling 14-day window and forgets everything older.
# Without a snapshot there is no way to tell whether a change in how the repository
# is presented moved anything. Results land on the orphan `traffic-stats` branch so
# they never touch main's history.
#
# The traffic endpoints need repository Administration: read. The built-in
# GITHUB_TOKEN does not have it and returns 403, so views and clones are recorded
# as null until a token is stored as the TRAFFIC_TOKEN secret.
#
# Use a FINE-GRAINED personal access token, not a classic one: scope it to this
# repository only, grant Administration: read (plus Metadata: read, which is
# mandatory), and set a short expiry. A classic `repo` token would carry write
# access to every repository the owner can reach, which this job never needs.
# Stars and the timeline are captured either way.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append this week's snapshot
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin traffic-stats >/dev/null 2>&1; then
            git fetch origin traffic-stats
            git checkout traffic-stats
          else
            git checkout --orphan traffic-stats
            git rm -rqf . || true
          fi

          mkdir -p traffic
          stamp="$(date -u +%Y-%m-%d)"

          # A 403 here means TRAFFIC_TOKEN is absent. gh prints the error body to
          # stdout, so discard it on failure and emit null instead.
          fetch() {
            local body
            if body="$(gh api "repos/$REPO/$1" 2>/dev/null)"; then
              printf '%s' "$body"
            else
              printf 'null'
            fi
          }
          fetch 'traffic/views'            > /tmp/views.json
          fetch 'traffic/clones'           > /tmp/clones.json
          fetch 'traffic/popular/referrers' > /tmp/referrers.json
          fetch 'traffic/popular/paths'     > /tmp/paths.json
          stars="$(gh api "repos/$REPO" --jq .stargazers_count)"

          jq -n \
            --arg date "$stamp" \
            --argjson stars "$stars" \
            --slurpfile views /tmp/views.json \
            --slurpfile clones /tmp/clones.json \
            --slurpfile referrers /tmp/referrers.json \
            --slurpfile paths /tmp/paths.json \
            '{
               date: $date,
               stars: $stars,
               traffic_available: (($views[0] | type) == "object" and ($views[0].count != null)),
               views:  (if ($views[0]  | type) != "object" or $views[0].count  == null then null else {count:$views[0].count,  uniques:$views[0].uniques}  end),
               clones: (if ($clones[0] | type) != "object" or $clones[0].count == null then null else {count:$clones[0].count, uniques:$clones[0].uniques} end),
               referrers: $referrers[0],
               paths: $paths[0]
             }' \
            > "traffic/$stamp.json"

          jq -c '{date,stars,traffic_available,views,clones}' "traffic/$stamp.json" \
            >> traffic/history.jsonl
          sort -u -o traffic/history.jsonl traffic/history.jsonl

          git add traffic
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: traffic snapshot $stamp"
          git push origin traffic-stats
