name: ci
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make install
      - run: make test
      - name: Regenerate committed proof artifacts
        run: make demo
      - name: Reject generated-artifact drift
        run: git diff --exit-code
      - name: Verify deterministic regeneration
        run: make check-generated
      - name: Validate portfolio proof contract
        run: make proof-check
      - name: Check patch whitespace
        run: git diff --check
