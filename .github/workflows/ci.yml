name: ci
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: make install
      - run: make test
      - name: Regenerate committed artifacts
        run: make demo
      - name: Reject generated-artifact drift
        run: git diff --exit-code
      - name: Verify deterministic regeneration
        run: make check-generated
      - name: Validate the verification manifest
        run: make manifest-check
      - name: Validate shared workflow control contract
        run: make contract-check
      - name: Build the Pages site and check its links
        run: make site-check
      - name: Check patch whitespace
        run: git diff --check

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the optional MCP extra at its floor and test the server
        run: |
          python -m pip install -e ".[mcp]" "mcp==1.30.0"
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
          python -m unittest tests.test_mcp_server -v
      - name: Upgrade to the latest 1.x release and test the server again
        run: |
          python -m pip install --upgrade "mcp<2"
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
          python -m unittest tests.test_mcp_server -v
      - name: Check the plugin manifests parse
        run: python -c "import json,glob; [json.load(open(f)) for f in glob.glob('.claude-plugin/*.json')+glob.glob('plugins/*/.claude-plugin/*.json')+glob.glob('plugins/*/.mcp.json')]"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the pinned lint tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff and mypy on the core package and its tests
        run: make lint PYTHON=python
      - name: Statement coverage of the core, with the floor set in the Makefile
        run: make coverage PYTHON=python

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The oldest Python the package promises to support.
          python-version: "3.10"
      - name: Build the wheel, install it in a clean environment and run it
        run: make package-check PYTHON=python

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install supervised-agent dependencies
        run: pip install -r supervised-agent/requirements.txt
      - name: Install supervised-agent dev tooling
        run: pip install -r supervised-agent/requirements-dev.txt
      - name: Install Playwright and Chromium for the review-room browser tests
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.64.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Lint, type-check, test and compile the agent (browser tests required)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          REQUIRE_BROWSER_TESTS: "1"
        run: make -C supervised-agent check PYTHON=python PYTEST_ARGS=-rA
