[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-function-os"
version = "0.2.0"
description = "Deterministic legal function operating system with a review-gated industrial robotics RaaS deal desk."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sebastian Förste" }]
keywords = ["legal-ops", "legal-engineering", "governance", "gc", "robotics", "raas"]
dependencies = []

[project.scripts]
legal-function-os = "legal_function_os.cli:main"
raas-deal-desk = "legal_function_os.raas_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
