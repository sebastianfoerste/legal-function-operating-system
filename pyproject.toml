[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-function-os"
version = "0.3.0"
description = "Deterministic legal function operating system with review-gated deal-desk workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sebastian Förste" }]
keywords = ["legal-ops", "legal-engineering", "governance", "gc", "deal-desk", "commercial-contracts"]
dependencies = []

[project.scripts]
legal-function-os = "legal_function_os.cli:main"
raas-deal-desk = "legal_function_os.raas_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legal_function_os = ["data/*.json"]
